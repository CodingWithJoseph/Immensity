[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "problemfinder-ai"
version = "0.1.0"
description = "ProblemFinder AI pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["problemfinder*", "classifier*", "scraper*", "util*"]
